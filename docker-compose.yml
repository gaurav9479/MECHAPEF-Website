version: '3.8'

services:
  client:
    build:
      context: ./Client
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    volumes:
      - ./Client:/app
      - client_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_HOST=0.0.0.0
      # Use polling to ensure hot-reloading works properly across OS (especially Windows)
      - CHOKIDAR_USEPOLLING=true 

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development

volumes:
  client_node_modules:
  backend_node_modules:
